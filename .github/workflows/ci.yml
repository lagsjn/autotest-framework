# 持续集成（CI）：手动触发时，GitHub 云端 Ubuntu 机器自动跑一遍接口层测试 + UI 冒烟
# 什么是 GitHub Actions：GitHub 自带的 CI 工具，仓库里放一个 yml 描述"何时、在哪、跑什么"，
# 它就在云端开一台干净机器执行——相当于"不要钱的 Jenkins"
# 为什么第一步只跑接口层不跑 UI：UI 需要浏览器和显示环境（headless 配置是下一课），
# 接口层无浏览器依赖、快、稳，先把流水线跑绿建立信任，再逐档加宽
name: CI

on:
  # 仅手动触发：被测系统在私有内网，公开仓库若挂 push/PR 自动触发，
  # 云端 runner 访问不到内网会把红叉刷满门面（红的是环境可达性，不是代码质量）。
  # 演示时从可达内网的环境手动触发，绿灯历史记录见 Actions 页
  workflow_dispatch:        # 在网页上点按钮触发（需仓库写权限，陌生人点不了）

jobs:
  api-tests:
    name: 接口层自动化（只读档 + E2E 写档）
    runs-on: ubuntu-latest  # GitHub 提供的云端干净机器（Ubuntu Linux——顺便练 JD 里的 Linux）
    timeout-minutes: 15     # 兜底：网络异常卡死时别把 runner 占满

    env:
      # 敏感配置从仓库 Secrets 注入环境变量（Settings → Secrets and variables → Actions）。
      # config.py 用 os.getenv 读取且 load_dotenv 默认不覆盖已有环境变量，所以 CI 无需 .env 文件。
      # 账号真值不进仓库，只进 GitHub 的加密存储——和 .gitignore 拉黑 .env 是同一个思想的两半
      TEST_BASE_URL: ${{ secrets.TEST_BASE_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_STUDENT_BASE_URL: ${{ secrets.TEST_STUDENT_BASE_URL }}
      TEST_STUDENT_USERNAME: ${{ secrets.TEST_STUDENT_USERNAME }}
      TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
      TEST_VERIFY_SSL: "false"  # 被测系统是自签证书测试环境（与本地默认一致），严禁指向生产

    steps:
      - uses: actions/checkout@v4   # 第一步永远是：把仓库代码检出到 runner

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"    # 本地是 3.14，CI 用 3.12（runner 支持成熟、依赖全兼容）

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 跑只读接口档（登录/鉴权矩阵，不写数据）
        # 这两个文件全是绿级只读用例；addopts 的默认排除档对它们无影响（未带写标签）
        # 注意：不能直接用 -m smoke 选——smoke 标签同时挂在 UI 用例上，CI 第一步没浏览器
        # --junitxml：只产出结果汇总（用例名+通过/失败），不碰含运行日志的 allure-results
        run: pytest testcases/test_api_login.py testcases/test_api_authz.py -v --junitxml=junit-api.xml

      - name: 跑接口 E2E 写档（自建 AT-* 沙箱、用例内自清理）
        # 命令行 -m 会覆盖 pytest.ini addopts 里的 -m（后者优先）；negative/l5 继续不进 CI
        run: pytest -m "api_e2e or lesson_e2e" -v --junitxml=junit-e2e.xml

      - name: 上传 JUnit 结果汇总（失败也传）
        if: always()
        # 【为什么不传 allure-results】公开仓库的 Actions 产物不需要登录就能下载，
        # 而 allure-results 里的日志附件带着环境真值（完整请求地址+端口），
        # 参数化实参带着真实账号——.gitignore 只拦仓库文件，拦不住 artifact。
        # JUnit XML 只有用例名与结果状态，没有运行时真值，可以公开
        uses: actions/upload-artifact@v4
        with:
          name: junit-summary
          path: junit-*.xml
          retention-days: 7         # 完整报告本地生成：把结果数据拉回本地跑 allure serve 即可

  ui-smoke:
    name: UI 冒烟（无头 Edge）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 与 api-tests 并行独立跑：UI 偶发波动不该把接口档的结果一起抹掉，两边红各自查

    env:
      TEST_BASE_URL: ${{ secrets.TEST_BASE_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_STUDENT_BASE_URL: ${{ secrets.TEST_STUDENT_BASE_URL }}
      TEST_STUDENT_USERNAME: ${{ secrets.TEST_STUDENT_USERNAME }}
      TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
      TEST_VERIFY_SSL: "false"
      HEADLESS: "true"   # conftest 认这个环境变量切无头浏览器：云端没有显示器，不无头必挂

    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 跑冒烟用例（smoke 档：登录主链路 + 进课/页签/回放的 UI 主干）
        # -m smoke 同时选中标了 smoke 的接口用例和 UI 用例，重复跑接口那两条成本可忽略；
        # 本地已预演：无头模式 8 条全过（2026-11-18）
        # 重试兜底：runner 在美国、被测系统在阿里云中国，浏览器跨境加载整页 SPA 时好时坏
        # （2026-11-18 实锤：同代码一次绿一次 ReadTimeout，接口 job 同时全绿——小请求不受影响）；
        # 跨境抖动不可控，整轮重跑最多 3 次，任一轮全绿即通过；战略解法是自托管 runner（见笔记）
        run: |
          for attempt in 1 2 3; do
            if pytest -m smoke -v --junitxml=junit-ui.xml; then exit 0; fi
            echo "第 $attempt 次未通过，等 30 秒后重试（等跨境链路恢复）"
            sleep 30
          done
          echo "3 次均未通过"; exit 1

      - name: 上传 JUnit 结果汇总（失败也传）
        if: always()
        # 同上：不上传 allure-results 与 log/screenshot/（截图拍的是被测系统真实界面，
        # 属于内部细节）；这两类证据只在本地报告里看，面试现场演示
        uses: actions/upload-artifact@v4
        with:
          name: ui-junit-summary
          path: junit-ui.xml
          retention-days: 7

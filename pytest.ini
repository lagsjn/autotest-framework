[pytest]
testpaths = testcases

# 自定义标签：跑之前先看一眼，带 negative 的用例会产生真实的失败登录
markers =
    negative: 会真实提交失败登录、污染账号状态的用例（需专用废弃账号才跑）
    smoke: 冒烟级——核心主干只读链路，每次构建必跑，绿级零副作用
    l5: 跨端端到端（会真实建课+让学生加入，写操作），需专门 -m l5 才跑，用例内自动归档收尾
    api_e2e: 接口端到端串联（建课/加入/归档 真写数据，但不开浏览器），需专门 -m api_e2e 才跑
    lesson_e2e: 上课状态机 E2E（建讲次/start/end 真改课堂状态），需专门 -m lesson_e2e 才跑，用例内自下课+归档收尾
    live: 实时工作台跨层 E2E（真 start 开课 + 浏览器进大屏，红级写），需专门 -m live 才跑，用例内自下课+归档收尾

# 默认执行时排除写操作标签，防止手一抖把账号锁了/把环境造脏
# 想跑它们：python -m pytest -m negative   /   -m l5   /   -m api_e2e   /   -m lesson_e2e
# 想全部跑：python -m pytest -m "not nothing"
# --alluredir：把结果数据写到 allure-results/
# --clean-alluredir：每次跑前清空上次的，和 FileHandler 的 mode="w" 同款思想
# 自签证书接口会报 InsecureRequestWarning。这条屏蔽与 config.VERIFY_SSL 配套：
# 仅当 VERIFY_SSL=false（默认，隔离测试环境有意关掉校验）时才该屏蔽——关掉校验是
# 有意为之、不该刷屏；一旦把 config.VERIFY_SSL 切成 true（正规校验），必须同时
# 删掉下面这行 ignore，否则真出现证书问题会被咽掉。其它告警照旧可见
# （靠 base_api 里的 disable_warnings 不够：pytest 每条用例会重置告警过滤器）
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning

addopts = -m "not negative and not l5 and not api_e2e and not lesson_e2e and not live" --alluredir=allure-results --clean-alluredir